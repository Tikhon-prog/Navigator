name: iPhone PWA validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  validate-pwa:
    name: Validate and package the iPhone PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PWA manifest, shell and local assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import json
          import re

          root = Path("website")
          required = [
              "index.html",
              "manifest.webmanifest",
              "service-worker.js",
              "assets/app.css",
              "assets/app.js",
              "assets/app-icon.svg",
              "assets/apple-touch-icon.png",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing PWA files: " + ", ".join(missing))

          manifest = json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("display") != "standalone":
              raise SystemExit("PWA manifest must use display=standalone")
          if not manifest.get("name") or not manifest.get("short_name"):
              raise SystemExit("PWA manifest must define name and short_name")
          for icon in manifest.get("icons", []):
              src = icon.get("src", "").strip()
              if not src or not (root / src).is_file():
                  raise SystemExit(f"Manifest icon is missing: {src!r}")

          class LocalAssets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in {"src", "href"} or not value:
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or parsed.netloc or value.startswith(("#", "data:")):
                          continue
                      path = parsed.path
                      if path:
                          self.paths.append(path)

          html = (root / "index.html").read_text(encoding="utf-8")
          parser = LocalAssets()
          parser.feed(html)
          for asset in parser.paths:
              if not (root / asset.lstrip("./")).is_file():
                  raise SystemExit(f"HTML references a missing local asset: {asset}")

          worker = (root / "service-worker.js").read_text(encoding="utf-8")
          if 'navigator.serviceWorker.register("./service-worker.js")' not in html:
              raise SystemExit("index.html does not register the PWA service worker")
          if "CACHE_NAME" not in worker or "event.waitUntil" not in worker:
              raise SystemExit("Service worker is missing cache install/activation logic")
          if "Authorization" not in worker or "/api" not in worker:
              raise SystemExit("Service worker must explicitly protect authenticated/API requests")

          print("iPhone PWA validation passed.")
          print(f"Validated {len(required)} required files and {len(parser.paths)} HTML asset references.")
          PY

      - name: Package static iPhone PWA
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd website && zip -qry ../dist/Pokolenie-iPhone-PWA.zip .)
          test -s dist/Pokolenie-iPhone-PWA.zip
          (cd dist && sha256sum Pokolenie-iPhone-PWA.zip > Pokolenie-iPhone-PWA.zip.sha256)
          ls -lh dist

      - name: Upload iPhone PWA bundle
        uses: actions/upload-artifact@v7
        with:
          name: pokolenie-iphone-pwa
          path: |
            dist/Pokolenie-iPhone-PWA.zip
            dist/Pokolenie-iPhone-PWA.zip.sha256
          if-no-files-found: error
          retention-days: 14
