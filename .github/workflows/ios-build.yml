name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --dart-define=POKOLENIE_API_BASE_URL="${{ vars.POKOLENIE_API_BASE_URL }}"
      - name: Package unsigned app and IPA container
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Pokolenie-iOS-unsigned.zip
          mkdir -p ipa/Payload
          ditto Runner.app ipa/Payload/Runner.app
          cd ipa
          zip -qry ../Pokolenie-unsigned.ipa Payload
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-ios-unsigned
          path: |
            build/ios/iphoneos/Pokolenie-iOS-unsigned.zip
            build/ios/iphoneos/Pokolenie-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
