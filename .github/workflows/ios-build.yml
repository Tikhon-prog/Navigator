name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        env:
          POKOLENIE_API_BASE_URL: ${{ vars.POKOLENIE_API_BASE_URL }}
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner
          DERIVED_DATA="$GITHUB_WORKSPACE/build/ios/DerivedData"
          DART_DEFINE="$(printf 'POKOLENIE_API_BASE_URL=%s' "$POKOLENIE_API_BASE_URL" | base64 | tr -d '\n')"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            "DART_DEFINES=$DART_DEFINE" \
            build
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = "ru.pokolenie.navigator"
          mkdir -p build/ios/iphoneos/ipa/Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            build/ios/iphoneos/Pokolenie-iOS-unsigned.zip
          ditto "$APP_PATH" build/ios/iphoneos/ipa/Payload/Runner.app
          (cd build/ios/iphoneos/ipa && zip -qry ../Pokolenie-unsigned.ipa Payload)

      - name: Verify unsigned iOS artifacts
        run: |
          set -euo pipefail
          test -s build/ios/iphoneos/Pokolenie-iOS-unsigned.zip
          test -s build/ios/iphoneos/Pokolenie-unsigned.ipa

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v7
        with:
          name: pokolenie-ios-unsigned
          path: |
            build/ios/iphoneos/Pokolenie-iOS-unsigned.zip
            build/ios/iphoneos/Pokolenie-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
