name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, analysis and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.app-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Scan checkout for committed secrets
        run: python backend/security_check.py

      - name: Backend regression tests
        run: python -m unittest discover -s backend/tests -v

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Verify Flutter toolchain
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Read application version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version: *['\" ]*\([^'\" ]*\).*/\1/p" pubspec.yaml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  dependency-audit:
    name: Audit backend dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install audit tool
        run: python -m pip install pip-audit

      - name: Report known dependency vulnerabilities
        run: pip-audit -r backend/requirements.txt

  android-build:
    name: Android APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          POKOLENIE_API_BASE_URL: ${{ vars.POKOLENIE_API_BASE_URL }}
        run: flutter build apk --release --target-platform android-arm64,android-x64 --dart-define="POKOLENIE_API_BASE_URL=$POKOLENIE_API_BASE_URL"

      - name: Verify APK and create SHA-256 checksum
        shell: bash
        env:
          APP_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          mkdir -p dist
          cp "$apk" "dist/Pokolenie-${APP_VERSION}.apk"
          (cd dist && sha256sum "Pokolenie-${APP_VERSION}.apk" > "Pokolenie-${APP_VERSION}.apk.sha256")
          file "dist/Pokolenie-${APP_VERSION}.apk"
          ls -lh dist

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: pokolenie-android-${{ needs.quality.outputs.version }}
          path: |
            dist/Pokolenie-*.apk
            dist/Pokolenie-*.apk.sha256
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Windows EXE installer
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Enable desktop target and read version
        id: app-version
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $versionLine) { throw 'Could not find version in pubspec.yaml' }
          $version = ($versionLine -split ':', 2)[1].Trim().Trim("'").Trim('"')
          if (-not $version) { throw 'Application version is empty' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          POKOLENIE_API_BASE_URL: ${{ vars.POKOLENIE_API_BASE_URL }}
        run: flutter build windows --release "--dart-define=POKOLENIE_API_BASE_URL=$env:POKOLENIE_API_BASE_URL"

      - name: Verify complete Windows bundle
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          $required = @(
            'pokolenie.exe',
            'flutter_windows.dll',
            'data\flutter_assets\AssetManifest.bin',
            'data\flutter_assets\assets\maps\floor1.webp'
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $releaseDir $relativePath
            if (-not (Test-Path $path)) { throw "Required Windows runtime file is missing: $path" }
          }
          $totalBytes = (Get-ChildItem $releaseDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Windows runtime bundle size: {0:N1} MB" -f ($totalBytes / 1MB))
          if ($totalBytes -lt 10MB) { throw 'Windows runtime bundle is unexpectedly small; refusing to package it.' }

      - name: Prepare complete portable Windows bundle
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          $portableDir = "dist/Pokolenie-Windows-Portable-$env:APP_VERSION"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path (Join-Path $releaseDir '*') -Destination $portableDir -Recurse -Force
          if (-not (Test-Path (Join-Path $portableDir 'pokolenie.exe'))) { throw 'Portable Windows EXE is missing' }
          if (-not (Test-Path (Join-Path $portableDir 'flutter_windows.dll'))) { throw 'Portable Flutter runtime is missing' }
          if (-not (Test-Path (Join-Path $portableDir 'data\flutter_assets\AssetManifest.bin'))) { throw 'Portable Flutter assets are missing' }
          Get-ChildItem $portableDir -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Host ("Portable bundle size: {0:N1} MB" -f ($_.Sum / 1MB))
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler ISCC.exe is unavailable' }

      - name: Build Windows installer EXE
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DMyAppVersion=$env:APP_VERSION" 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "dist/Pokolenie-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Installer EXE was not created: $installer" }
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object {
            Write-Host ("Created {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Upload Windows installer and portable application
        uses: actions/upload-artifact@v7
        with:
          name: pokolenie-windows-${{ steps.app-version.outputs.version }}
          path: |
            dist/Pokolenie-Setup-*.exe
            dist/Pokolenie-Windows-Portable-*/**
          if-no-files-found: error
          retention-days: 14
