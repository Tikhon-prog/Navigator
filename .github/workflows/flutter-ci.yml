name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Scan current checkout for committed secrets
        run: python backend/security_check.py

      - name: Backend security regression tests
        run: python -m unittest discover -s backend/tests -v

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Read application version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version: *['\" ]*\([^'\" ]*\).*/\1/p" pubspec.yaml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        env:
          POKOLENIE_API_BASE_URL: ${{ vars.POKOLENIE_API_BASE_URL }}
        run: flutter build apk --release --dart-define=POKOLENIE_API_BASE_URL="${{ vars.POKOLENIE_API_BASE_URL }}"

      - name: Name APK and create SHA-256 checksum
        shell: bash
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Pokolenie-${APP_VERSION}.apk"
          (cd dist && sha256sum "Pokolenie-${APP_VERSION}.apk" > "Pokolenie-${APP_VERSION}.apk.sha256")
          test -s "dist/Pokolenie-${APP_VERSION}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-android-${{ steps.app-version.outputs.version }}
          path: |
            dist/Pokolenie-*.apk
            dist/Pokolenie-*.apk.sha256
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Windows EXE installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Enable Windows desktop and read version
        id: app-version
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $versionLine) { throw 'Could not find version in pubspec.yaml' }
          $version = ($versionLine -split ':', 2)[1].Trim().Trim("'").Trim('"')
          if (-not $version) { throw 'Application version is empty' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          POKOLENIE_API_BASE_URL: ${{ vars.POKOLENIE_API_BASE_URL }}
        run: flutter build windows --release --dart-define=POKOLENIE_API_BASE_URL=$env:POKOLENIE_API_BASE_URL

      - name: Verify Windows app bundle
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          $appExe = Join-Path $releaseDir 'pokolenie.exe'
          if (-not (Test-Path $appExe)) { throw "Windows EXE not found: $appExe" }
          if (-not (Test-Path (Join-Path $releaseDir 'data'))) { throw 'Flutter data directory missing from Windows bundle' }
          if (-not (Test-Path (Join-Path $releaseDir 'flutter_windows.dll'))) { throw 'Flutter runtime DLL missing from Windows bundle' }
          Get-ChildItem $releaseDir -Recurse | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Host ("Windows runtime bundle size: {0:N1} MB" -f ($_.Sum / 1MB))
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler ISCC.exe is unavailable' }

      - name: Build Windows installer EXE
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DMyAppVersion=$env:APP_VERSION" 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "dist/Pokolenie-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Installer EXE was not created: $installer" }
          Copy-Item 'build/windows/x64/runner/Release/pokolenie.exe' 'dist/Pokolenie.exe' -Force
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object { Write-Host ("Created {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Upload Windows EXE installer and app executable
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-windows-${{ steps.app-version.outputs.version }}
          path: |
            dist/Pokolenie-Setup-*.exe
            dist/Pokolenie.exe
          if-no-files-found: error
          retention-days: 14
