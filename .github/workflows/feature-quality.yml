name: Feature quality checks

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter tests, analysis and backend tests (no builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Scan checkout for committed secrets
        run: python backend/security_check.py

      - name: Backend regression tests
        run: python -m unittest discover -s backend/tests -v

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Deliberately no flutter build apk/windows steps in this workflow.
