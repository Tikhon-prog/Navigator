name: Поколение — ручная release-сборка APK

on:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Scan for committed secrets
        run: python backend/security_check.py

      - name: Backend security tests
        run: python -m unittest discover -s backend/tests -v

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Read application version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version: *['\" ]*\([^'\" ]*\).*/\1/p" pubspec.yaml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64,android-x64 --dart-define=POKOLENIE_API_BASE_URL="${{ vars.POKOLENIE_API_BASE_URL }}"

      - name: Prepare named APK and SHA-256 checksum
        shell: bash
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_name="Pokolenie-${APP_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          (cd dist && sha256sum "${apk_name}" > "${apk_name}.sha256")

      - name: Upload release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-${{ steps.app-version.outputs.version }}-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
