name: Поколение — ручная сборка APK 0.2.0

on:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Scan for committed secrets
        run: python backend/security_check.py

      - name: Backend security tests
        run: python -m unittest discover -s backend/tests -v

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --dart-define=POKOLENIE_API_BASE_URL="${{ vars.POKOLENIE_API_BASE_URL }}"

      - name: Prepare named APK and SHA-256 checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Pokolenie-0.2.0+2.apk
          sha256sum dist/Pokolenie-0.2.0+2.apk > dist/Pokolenie-0.2.0+2.apk.sha256

      - name: Upload release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-0.2.0+2-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
