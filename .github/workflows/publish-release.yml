name: Build and publish Navigator release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Android launcher icon
        run: |
          python -m pip install Pillow
          python scripts/generate_android_icon.py


      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Scan for committed secrets
        run: python backend/security_check.py

      - name: Backend security tests
        run: python -m unittest discover -s backend/tests -v

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release/tag $TAG_NAME already exists; choose a new version."
            exit 1
          fi
          gh release create "$TAG_NAME" build/app/outputs/flutter-apk/app-release.apk \
            --title "Navigator $TAG_NAME" \
            --generate-notes \
            --latest
