services:
  navigator-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        ENABLE_FIREBASE: ${NAVIGATOR_ENABLE_FIREBASE:-false}
    env_file:
      - .env
    environment:
      NAVIGATOR_DB_PATH: /data/navigator.sqlite3
      # Trust X-Forwarded-For from the reverse proxy so the login limiter sees real client
      # addresses instead of one shared proxy address. Safe here only because the port below
      # is bound to 127.0.0.1: nothing but the local reverse proxy can reach the API.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - navigator_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  navigator_data:
