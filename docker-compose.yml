services:
  navigator-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        ENABLE_FIREBASE: ${NAVIGATOR_ENABLE_FIREBASE:-false}
    env_file:
      - .env
    environment:
      NAVIGATOR_DB_PATH: /data/navigator.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - navigator_data:/data
    restart: unless-stopped

volumes:
  navigator_data:
