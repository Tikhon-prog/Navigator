name: navigator
description: "Приложение школы «Поколение»: офлайн-навигация, расписание, ДОПы и школьные оповещения."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  http: ^1.5.0
  flutter_appauth: ^8.0.3
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  llm_llamacpp: ^0.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/floor1.webp
    - assets/maps/floor2.webp
    - assets/maps/floor3.webp
    - assets/data/rooms.json
    - assets/data/places.json
    - assets/data/school_schedule_2026-10-05.json
